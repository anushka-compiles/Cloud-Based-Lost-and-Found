{% extends "base.html" %}

{% block title %}
Register - Lost & Found
{% endblock %}

{% block content %}

<section class="form-section">

    <div class="form-container">

        <h1>Create Account</h1>

        <p class="form-description">
            Register to report lost or found items and manage your claims.
        </p>

        <form method="POST">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                minlength="6"
            >

            <button type="submit" class="btn primary">
                Create Account
            </button>

        </form>

        <p class="form-footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Login here</a>
        </p>

    </div>

</section>

{% endblock %}
