{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h1>Report an Item</h1>

    <p class="form-subtitle">
        Report a lost or found item so it can be matched with another report.
    </p>

    <form method="POST" enctype="multipart/form-data">

        <div class="form-group">
            <label for="item_type">Report Type</label>

            <select id="item_type" name="item_type" required>
                <option value="LOST"
                    {% if default_type == "LOST" %}selected{% endif %}>
                    Lost Item
                </option>

                <option value="FOUND"
                    {% if default_type == "FOUND" %}selected{% endif %}>
                    Found Item
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="name">Item Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Example: Black Wallet"
                required
            >
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Select category</option>
                <option value="Electronics">Electronics</option>
                <option value="Documents">Documents</option>
                <option value="Wallet">Wallet</option>
                <option value="Keys">Keys</option>
                <option value="Bag">Bag</option>
                <option value="Clothing">Clothing</option>
                <option value="Accessories">Accessories</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                rows="5"
                placeholder="Describe the item, colour, identifying marks, etc."
            ></textarea>
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input
                type="text"
                id="location"
                name="location"
                placeholder="Example: College Library"
                required
            >
        </div>

        <div class="form-group">
            <label for="date">Date</label>
            <input
                type="date"
                id="date"
                name="date"
                required
            >
        </div>
<div class="form-group">
    <label for="image">Item Photo</label>

    <input
        type="file"
        id="image"
        name="image"
        accept=".jpg,.jpeg,.png,.webp"
    >

    <small>Optional: JPG, JPEG, PNG or WEBP</small>
</div>
        <button type="submit" class="btn-primary">
            Submit Report
        </button>

    </form>

</div>

{% endblock %}
