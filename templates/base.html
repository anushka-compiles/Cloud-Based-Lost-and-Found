<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Lost & Found{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header class="navbar">

        <div class="container navbar-content">

            <a href="{{ url_for('home') }}" class="logo">
                Lost & Found
            </a>

            <nav>

                <a href="{{ url_for('home') }}">
                    Home
                </a>

                <a href="{{ url_for('search') }}">
                    Search Items
                </a>

                {% if session.get("email") %}

                    <a href="{{ url_for('report_item', type='LOST') }}">
                        Report Lost
                    </a>

                    <a href="{{ url_for('report_item', type='FOUND') }}">
                        Report Found
                    </a>

                    <a href="{{ url_for('logout') }}">
                        Logout
                    </a>

                {% else %}

                    <a href="{{ url_for('login') }}">
                        Login
                    </a>

                    <a href="{{ url_for('register') }}">
                        Register
                    </a>

                {% endif %}

            </nav>

        </div>

    </header>


    <main>

        {% block content %}
        {% endblock %}

    </main>


    <footer>

        <p>
            Cloud-Based Lost and Found Management System
        </p>

        <p>
            Python • Flask • AWS Cloud
        </p>

    </footer>

</body>

</html>
